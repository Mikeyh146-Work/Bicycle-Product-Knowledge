<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike hire parts guide: Trek Marlin 4 Gen 3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>Trek Marlin 4 Gen 3</h1>
    <p>Select a part on the bike, or use the buttons, to see what it is and what to check.</p>
  </header>

  <svg class="bike" viewBox="0 0 680 390" role="img" aria-label="Exploded view of a Trek Marlin 4 Gen 3 mountain bike">
    <g transform="translate(25,0)">
      <g class="part" id="p-rear" data-part="rear">
        <circle class="ln" cx="150" cy="230" r="60" stroke-width="4"/>
        <circle class="ln" cx="150" cy="230" r="52" stroke-width="1.5" opacity=".5"/>
        <path class="ln" d="M98 230H202M150 178V282M113 193L187 267M187 193L113 267" stroke-width="1" opacity=".35"/>
        <circle class="ln" cx="150" cy="230" r="22" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle class="fl" cx="150" cy="230" r="5"/>
        <text class="lbl" x="150" y="305" text-anchor="middle">Rear wheel</text>
      </g>
      <g class="part" id="p-front" data-part="front">
        <circle class="ln" cx="430" cy="230" r="60" stroke-width="4"/>
        <circle class="ln" cx="430" cy="230" r="52" stroke-width="1.5" opacity=".5"/>
        <path class="ln" d="M378 230H482M430 178V282M393 193L467 267M467 193L393 267" stroke-width="1" opacity=".35"/>
        <circle class="ln" cx="430" cy="230" r="22" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle class="fl" cx="430" cy="230" r="5"/>
        <text class="lbl" x="430" y="305" text-anchor="middle">Front wheel</text>
      </g>
      <g class="part" id="p-drive" data-part="drive">
        <circle class="ln" cx="265" cy="235" r="14" stroke-width="2.5"/>
        <circle class="fl" cx="265" cy="235" r="4"/>
        <path class="ln" d="M265 235L284 258" stroke-width="4"/>
        <rect class="fl" x="278" y="258" width="18" height="5" rx="2"/>
        <circle class="ln" cx="150" cy="230" r="14" stroke-width="2"/>
        <circle class="ln" cx="150" cy="230" r="9" stroke-width="1.5"/>
        <path class="ln" d="M148 241L142 262" stroke-width="3"/>
        <circle class="ln" cx="142" cy="265" r="4" stroke-width="2"/>
        <circle class="ln" cx="146" cy="277" r="4" stroke-width="2"/>
        <path class="ln" d="M265 221L150 216M265 249L146 281" stroke-width="1.3"/>
        <text class="lbl" x="235" y="292" text-anchor="middle">Drivetrain</text>
      </g>
      <g class="part" id="p-frame" data-part="frame">
        <path class="ln" d="M150 230L265 235L240 126L150 230M240 126Q315 120 385 140L265 235" stroke-width="5"/>
        <path class="ln" d="M386 134L392 156" stroke-width="7"/>
        <rect class="fl" x="145" y="236" width="8" height="10" rx="2"/>
        <text class="lbl" x="312" y="108" text-anchor="middle">Frame</text>
      </g>
      <g class="part" id="p-fork" data-part="fork">
        <path class="ln" d="M392 156L430 230" stroke-width="5"/>
        <path class="ln" d="M393 158L406 183" stroke-width="9" opacity=".6"/>
        <path class="ln" d="M385 156L401 153" stroke-width="4"/>
        <text class="lbl" x="440" y="172">Fork</text>
      </g>
      <g class="part" id="p-head" data-part="head">
        <rect class="ln" x="381" y="127" width="10" height="4" stroke-width="2"/>
        <rect class="ln" x="383" y="157" width="10" height="4" stroke-width="2"/>
        <path class="ln" d="M386 134V117" stroke-width="3"/>
        <path class="ln" d="M386 125L406 119" stroke-width="6"/>
        <text class="lbl" x="374" y="116" text-anchor="end">Stem and headset</text>
      </g>
      <g class="part" id="p-bars" data-part="bars">
        <path class="ln" d="M398 118L424 108" stroke-width="4"/>
        <path class="ln" d="M398 118L405 115M418 110L424 108" stroke-width="9"/>
        <text class="lbl" x="432" y="106">Bars and grips</text>
      </g>
      <g class="part" id="p-shift" data-part="shift">
        <rect class="ln" x="410" y="114" width="12" height="8" rx="2" stroke-width="2.5"/>
        <path class="ln" d="M416 122Q419 140 413 152" stroke-width="1.5" stroke-dasharray="3 3"/>
        <text class="lbl" x="428" y="134">Shifter and cables</text>
      </g>
      <g class="part" id="p-saddle" data-part="saddle">
        <path class="ln" d="M240 126L236 94" stroke-width="4"/>
        <rect class="ln" x="235" y="119" width="11" height="5" stroke-width="2.5"/>
        <path class="ln" d="M212 90H262" stroke-width="8"/>
        <text class="lbl" x="237" y="80" text-anchor="middle">Saddle and post</text>
      </g>
      <g class="part" id="p-brakes" data-part="brakes">
        <rect class="ln" x="424" y="200" width="10" height="14" rx="2" stroke-width="2.5"/>
        <rect class="ln" x="168" y="232" width="10" height="14" rx="2" stroke-width="2.5"/>
        <text class="lbl" x="429" y="194" text-anchor="middle">Brakes</text>
      </g>
    </g>
  </svg>

  <div class="slider">
    <label for="explode">Assembled</label>
    <input type="range" id="explode" min="0" max="100" step="1" value="0" aria-label="Exploded view amount">
    <span>Exploded</span>
  </div>

  <div id="chips" class="chips" role="group" aria-label="Choose a part"></div>
  <section id="panel" class="panel" aria-live="polite"></section>

  <footer class="foot">
    Part specs come from the Trek parts list. Daily checks are examples: replace them with your own SOPs in <code>js/parts.js</code>.
  </footer>
</main>
<script src="js/parts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
